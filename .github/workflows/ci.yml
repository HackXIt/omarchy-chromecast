name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin and helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Validate pinned workflow actions
        run: ./scripts/check-actions-pinned.sh

      - name: Validate Omarchy plugin manifest
        run: ./scripts/validate-plugin.sh .

      - name: Run helper tests
        run: node --test

      - name: Check helper syntax
        run: node --check bin/chromium-castctl test/fixtures/dummy-chromium-cast

      - name: Check shell script syntax
        run: bash -n install.sh scripts/validate-plugin.sh scripts/check-actions-pinned.sh scripts/release-notes.sh

      - name: Check release notes extraction
        run: ./scripts/release-notes.sh "v$(jq -r '.version' manifest.json)" >/dev/null
