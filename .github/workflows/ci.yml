name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin and helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Omarchy plugin manifest
        run: ./scripts/validate-plugin.sh .

      - name: Run helper tests
        run: node --test

      - name: Check helper syntax
        run: node --check bin/chromium-castctl

      - name: Check shell script syntax
        run: bash -n install.sh scripts/validate-plugin.sh
