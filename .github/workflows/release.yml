name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build release archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Validate pinned workflow actions
        run: ./scripts/check-actions-pinned.sh

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version="$(jq -r '.version' manifest.json)"
          if [[ "$tag" == "$version" ]]; then
            echo "Release tags must start with v, got: $tag" >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$version" ]]; then
            echo "manifest.json version ($manifest_version) does not match tag ($tag)" >&2
            exit 1
          fi

      - name: Validate Omarchy plugin manifest
        run: ./scripts/validate-plugin.sh .

      - name: Run helper tests
        run: node --test

      - name: Check helper syntax
        run: node --check bin/chromium-castctl test/fixtures/dummy-chromium-cast

      - name: Check shell script syntax
        run: bash -n install.sh scripts/validate-plugin.sh scripts/check-actions-pinned.sh scripts/release-notes.sh

      - name: Build release notes
        run: |
          mkdir -p dist
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md

      - name: Build release archives
        run: |
          mkdir -p dist
          prefix="omarchy-chromecast-${GITHUB_REF_NAME}/"
          git archive --format=tar.gz --prefix="$prefix" -o "dist/omarchy-chromecast-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          git archive --format=zip --prefix="$prefix" -o "dist/omarchy-chromecast-${GITHUB_REF_NAME}.zip" "$GITHUB_SHA"
          (cd dist && sha256sum "omarchy-chromecast-${GITHUB_REF_NAME}.tar.gz" "omarchy-chromecast-${GITHUB_REF_NAME}.zip" > SHA256SUMS)

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Publishing is restricted to v* tag pushes. Add a protected environment here
  # if the repository later requires a human approval gate for tag releases.
  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-archives
          path: dist

      - name: Verify release archive digests
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/omarchy-chromecast-${GITHUB_REF_NAME}.tar.gz \
            dist/omarchy-chromecast-${GITHUB_REF_NAME}.zip \
            --verify-tag \
            --title "omarchy-chromecast ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md
